<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#10171d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="飛巴">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>飛巴</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --fg:#16212b; --muted:#5d6b76; --line:#d9ded8;
  --accent:#0d7a69; --accent-fg:#ffffff; --warn:#a85f00; --bad:#b3261e; --good:#1b7a3a;
  --soft:#e6efec; --stop:#2a5db0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10171d; --card:#18222b; --fg:#e8edf0; --muted:#9aa8b2; --line:#2b3944;
    --accent:#3fc2aa; --accent-fg:#06211c; --warn:#f0b254; --bad:#ff8a80; --good:#7fd69a;
    --soft:#1f3a36; --stop:#7aa7ee; color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","Noto Sans CJK TC","PingFang HK","Microsoft JhengHei",sans-serif;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:max(24px,env(safe-area-inset-bottom,0px));}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 8px}
header h1{margin:0;font-size:24px;letter-spacing:.04em}
header .ver{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font:inherit;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row input[type=text]{flex:1 1 180px;min-width:0}
.inp{position:relative;flex:1 1 180px;min-width:0;display:flex}
.inp input[type=text]{width:100%;padding-right:38px}
.inp .x{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:17px;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.inp .x:active{background:var(--soft)}
input[type=text],select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button.b{padding:9px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;font:inherit}
button.b:active{background:var(--soft)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;padding:12px;width:100%;font-size:16px}
button:disabled{opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sugg{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sugg li button{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.sugg li:last-child button{border-bottom:0}
.sugg .src{font-size:11px;color:var(--muted);margin-left:6px}
.hint{font-size:13px;color:var(--muted)}
.banner{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px}
details{margin:2px 0 10px}
summary{cursor:pointer;color:var(--muted);font-weight:600;padding:4px 0}
details .field{margin-top:8px}
#mapWrap{position:relative;margin-bottom:10px}
#map{height:46vh;min-height:300px;border-radius:10px;border:1px solid var(--line);z-index:0}
[hidden]{display:none!important}
#mapWrap .fsbtn{position:absolute;right:10px;bottom:10px;z-index:1100;width:40px;height:40px;border:2px solid rgba(0,0,0,.25);border-radius:6px;background:#fff;color:#222;font-size:20px;line-height:1;cursor:pointer;padding:0}
#mapWrap.full .fsbtn{bottom:90px}
#mapWrap.full{position:fixed;inset:0;z-index:2000;margin:0;background:var(--bg)}
#mapWrap.full #map{height:100%;min-height:0;border-radius:0;border:0}
.pickbar{position:absolute;left:0;right:0;z-index:1500;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pickbar.top{top:0;padding-top:max(10px,env(safe-area-inset-top,0px))}
.pickbar.bottom{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.pickbar span{flex:1;min-width:0;overflow-wrap:anywhere}
.pickbar button{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-weight:700}
.pickbar button.ok{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pin{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.o{background:#1b7a3a}.pin.d{background:#b3261e}.pin.u{background:#2a5db0}.pin.x{background:#6b4aa8}.pin.t{background:#444}
.res{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card);cursor:pointer}
.res[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.res .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.res .tot{font-size:17px}.res .tot b{font-size:24px;font-variant-numeric:tabular-nums}
.res .nx{font-size:14px;color:var(--muted);white-space:nowrap}
.dbg{font-size:12px;color:var(--muted);margin-top:8px}.dbg div{margin-top:3px}
.res{position:relative}
.res .fare{position:absolute;top:10px;right:12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.res .top{padding-right:68px}
.res .sub.trw{font-size:16px}
.res .sub .tstop{font-size:15px;font-weight:600;color:var(--fg)}
@media (prefers-color-scheme:dark){.res .sub .tstop{color:#fff}}
.tag.sm{font-size:10px}
.eta{display:inline-block;padding:2px 10px;border-radius:8px;font-size:20px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums;vertical-align:middle}
.eta.y{background:#f7c600;color:#2b2200}
.eta.g{background:#1f9d55;color:#fff}
.tag.good{background:#1f9d55;color:#fff}
.res{scroll-margin-top:8px}
#results,#status{scroll-margin-top:10px}
.grp{font-weight:700;margin:14px 2px 6px;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--soft);margin-left:4px;vertical-align:middle}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.res .line{margin:6px 0}.res .sub{font-size:13px;color:var(--muted);margin-top:2px}
.rt{display:inline-block;padding:0 7px;border-radius:5px;background:#d32f2f;color:#fff;font-weight:700}
.rt.c{background:#4aa3ff;color:#000}
.wt{font-weight:800}.wt.y{color:#d9a400}.wt.g{color:#1f9d55}
.nx2{color:var(--muted);font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a{display:inline-block;padding:8px 10px;border:1px solid var(--accent);color:var(--accent);border-radius:8px;text-decoration:none;font-weight:600}
.diag li{padding:8px 0;border-bottom:1px solid var(--line);list-style:none;overflow-wrap:anywhere}
.diag{padding:0;margin:0}
.ok{color:var(--good);font-weight:700}.ng{color:var(--bad);font-weight:700}.run{color:var(--muted)}
textarea{width:100%;min-height:140px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:12px/1.4 ui-monospace,monospace}
.leaflet-container{font:inherit}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* ===== v11 介面 ===== */
html,body{height:100%;overflow:hidden}body{padding:0!important}
#mapWrap{position:fixed;inset:0;margin:0;z-index:0}
#map{height:100%;min-height:0;border:0;border-radius:0}
.fab{position:fixed;z-index:1200;width:46px;height:46px;border-radius:23px;border:0;background:var(--card);color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.4);font-size:22px;display:flex;align-items:center;justify-content:center;padding:0}
#btnSet{left:12px;top:max(12px,env(safe-area-inset-top))}
#locate{right:12px;bottom:max(24px,env(safe-area-inset-bottom))}
.brand{position:fixed;z-index:1200;right:12px;top:max(12px,env(safe-area-inset-top));font-size:24px;font-weight:800;letter-spacing:.04em;background:var(--card);color:var(--fg);padding:5px 14px;border-radius:23px;box-shadow:0 2px 10px rgba(0,0,0,.4);display:flex;align-items:flex-end;gap:3px;line-height:1.2}
.brand .ver{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:0;margin-bottom:3px}
#homeBox{position:fixed;z-index:1200;left:12px;right:12px;top:calc(50% + 26px);max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.4);max-height:calc(50% - 44px);overflow:auto}
#homeBox:not(.open) .more{display:none}
.hrow{display:flex;align-items:center;gap:6px;margin:4px 0}
.hrow .inp{flex:1 1 0}
.hrow input[type=text]{border-radius:20px;width:100%}
.ib{flex:0 0 auto;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:18px;padding:0}
.mapbtn{flex:0 0 auto;font-size:12px;padding:6px 9px;border-radius:14px}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:8px 4px 4px}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s}
body.picking #homeBox,body.picking .brand,body.picking #btnSet,body.picking #locate,body.inSheet .brand,body.inSheet #btnSet,body.inSheet #locate{display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;top:0;z-index:2500;background:var(--bg);display:flex;flex-direction:column;transition:top .25s}
#sheet.half{top:50%;border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.45)}
#sheetHead{touch-action:none;padding:max(8px,env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
#sheet.half #sheetHead{padding-top:8px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sumrow{display:flex;align-items:center;gap:8px}
#sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:16px}
#results{flex:1;overflow:auto;padding:6px 14px max(24px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#settings{position:fixed;inset:0;z-index:3500;background:var(--bg);overflow:auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
#toast{position:fixed;left:12px;right:12px;bottom:90px;z-index:4500;margin:0 auto;max-width:520px;background:#222;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px}
#etaBox{position:fixed;z-index:4000;left:12px;right:12px;top:28%;margin:0 auto;max-width:420px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.res .rt[data-k]{cursor:pointer;text-decoration:underline}
#sheetHead .sumrow{justify-content:center}
#sum{flex:0 1 auto;max-width:88%;border:1px solid var(--line);border-radius:22px;padding:8px 18px;background:var(--card);font-size:15px}
#fsBtn{z-index:2600}
body[data-view="detail"] #fsBtn{top:calc(50% - 62px);right:12px}
body[data-view="map"] #fsBtn{right:12px;bottom:max(24px,env(safe-area-inset-bottom))}
#navBtn{position:fixed;z-index:2600;left:50%;transform:translateX(-50%);bottom:max(28px,env(safe-area-inset-bottom));padding:12px 22px;border-radius:26px;background:var(--accent);color:var(--accent-fg);border:0;font-weight:700;font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#navInfo{position:fixed;z-index:2600;left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top));background:var(--card);color:var(--fg);padding:8px 16px;border-radius:22px;box-shadow:0 2px 10px rgba(0,0,0,.4);font-weight:700;max-width:90%}
#peek{position:fixed;z-index:1200;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(60%,260px);text-align:center;background:var(--card);color:var(--muted);border-radius:22px;padding:6px 10px 8px;box-shadow:0 2px 10px rgba(0,0,0,.4);touch-action:none;font-size:13px}
#peek .grab{margin-bottom:4px}
body.picking #peek{display:none}
#homeBox{left:15%;right:15%;max-width:392px}
#homeBox.open{top:max(70px,calc(env(safe-area-inset-top) + 64px));max-height:calc(var(--vh,100vh) - 90px)}
body:not([data-view="home"]) #homeBox{display:none}
#sum{position:fixed;z-index:2700;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:86%;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#sheetHead{padding-top:max(60px,calc(env(safe-area-inset-top) + 52px))}
#sheet.half #sheetHead{padding-top:8px}
body[data-view="map"] #locate{display:flex!important;right:12px;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 62px);z-index:2600}
body{font-family:"Noto Sans HK","Noto Sans CJK HK","Noto Sans TC",system-ui,sans-serif;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
.pin{width:26px;height:26px;border-radius:13px;font-size:11px;font-weight:600;color:#fff;border:2px solid var(--pc,#fff);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc,#fff) 28%,transparent),0 2px 6px rgba(0,0,0,.5)}
.pin.o,.pin.d,.pin.u,.pin.x,.pin.t{background:#0d1620}
.pin.o{--pc:#27d3b0}.pin.d{--pc:#8b7bff}.pin.u{--pc:#f5b83d}.pin.x{--pc:#c084fc}.pin.t{--pc:#9aa4ad}
.res{border-radius:16px;padding:14px 16px;border-color:transparent}
.res .tot{font-size:14px;color:var(--muted)}
.res .tot b{font-size:30px;font-weight:700;color:var(--fg);letter-spacing:-.01em}
.res .fare{top:15px;right:16px;font-size:15px;font-weight:600;color:var(--muted)}
.res .nx{font-size:13px}
.tag{font-size:11px;font-weight:600}
/* ===== v12 科技感外觀（固定深色） ===== */
:root{--bg:#0a111a;--card:rgba(15,24,36,.86);--fg:#e8f1f5;--muted:#8fa1ad;--line:rgba(255,255,255,.09);--soft:rgba(255,255,255,.06);--accent:#27d3b0;--accent-fg:#04201a;color-scheme:dark}
#homeBox,.fab,.brand,#sum,#peek,#etaBox{backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.fab{background:rgba(14,22,33,.82);border:1px solid var(--line);color:var(--accent)}
.brand{background:rgba(12,20,31,.84);border:1px solid var(--line);font-weight:300;letter-spacing:.2em;color:#f2fbff;text-shadow:0 0 12px rgba(39,211,176,.55)}
#homeBox{background:rgba(12,20,31,.84);border:1px solid rgba(39,211,176,.28);border-radius:22px;box-shadow:0 0 26px rgba(39,211,176,.12),0 10px 30px rgba(0,0,0,.55)}
#homeBox input[type=text]{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg)}
#homeBox input[type=text]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(39,211,176,.2)}
.ib,.mapbtn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--accent)}
#go{background:linear-gradient(135deg,#27d3b0,#4aa8ff);color:#04201a;border:0;font-weight:700;letter-spacing:.12em;border-radius:20px}
#sheet{background:rgba(9,15,23,.96)}
#sheetHead{border-bottom:0}
#sum{background:rgba(12,20,31,.84);border:1px solid rgba(39,211,176,.32);font-size:14px;font-weight:500;letter-spacing:.04em}
.grp{font-size:12px;font-weight:600;letter-spacing:.24em;color:var(--muted);margin:16px 4px 8px}
.res{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:none}
.res[aria-selected="true"]{border-color:rgba(39,211,176,.65);box-shadow:0 0 0 1px rgba(39,211,176,.3),0 0 20px rgba(39,211,176,.16)}
.res .tot b{font-weight:600;color:#fff}
.res .line{margin:10px 0 6px;color:var(--fg)}
.res .rt{border-radius:6px;font-weight:700;font-size:12px;padding:1px 7px;letter-spacing:0}
.res .rt[data-k]{text-decoration:none;box-shadow:inset 0 -2px 0 rgba(255,255,255,.4)}
.res .leg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.res .leg .arr{color:var(--muted)}
.res .leg .stp{color:var(--muted)}
.res .leg .cnt{margin-left:auto;color:var(--muted);font-size:12px}
.res .sub.trw{font-size:15px;margin-top:8px}
.tag{background:rgba(255,255,255,.07);color:var(--fg);border:0;border-radius:999px;padding:2px 9px}
.tag.good{background:rgba(39,211,176,.16);color:#7ff0d8}
.tag.warn{background:transparent;border:1px solid rgba(245,184,61,.5);color:#f5b83d}
.dbg{opacity:.7}
.res .leg .arrw{display:inline-flex;flex-direction:column;align-items:center;color:var(--muted);line-height:1.1}
.res .leg .arrw small{font-size:10px;font-weight:300;margin-top:1px;letter-spacing:.04em}
.res .tot{font-size:13px}
.res .tot b{font-size:22px}
.glowwide{filter:blur(6px);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.8}}
.leaflet-tile{outline:1px solid transparent}
.grp{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.3em;padding:5px 14px 5px 16px;border-radius:999px;margin:16px 4px 8px}
.grp.g-d{background:rgba(39,211,176,.18);color:#7ff0d8;border:1px solid rgba(39,211,176,.5)}
.grp.g-t{background:rgba(74,168,255,.18);color:#9cd0ff;border:1px solid rgba(74,168,255,.5)}
</style>
</head>
<body data-view="home">
<div id="mapWrap">
  <div id="map" aria-label="地圖"></div>
  <div class="pickbar top" id="pickTop" hidden><span id="pickMsg"></span><button type="button" id="pickCancel">取消</button></div>
  <div class="pickbar bottom" id="pickBottom" hidden><span id="pickLabel">請點一下地圖</span><button type="button" class="ok" id="pickOk" disabled>確定</button></div>
</div>
<div id="envWarn" class="banner" hidden style="position:fixed;z-index:1300;left:12px;right:12px;top:70px"></div>
<button type="button" class="fab" id="btnSet" aria-label="設定">⚙</button>
<div class="brand">飛巴<span class="ver">v14.2</span></div>
<button type="button" class="fab" id="locate" aria-label="回到目前位置">◎</button>

<div id="homeBox">
  <div class="more">
    <div class="hrow"><div class="inp"><input id="qO" type="text" value="目前位置" autocomplete="off" enterkeyhint="search" aria-label="起點"><button type="button" class="x" id="xO" aria-label="清除起點內容">×</button></div><button type="button" class="ib" id="gpsO" title="起點用目前位置" aria-label="起點用目前位置">◎</button><button type="button" class="b mapbtn" id="mapO">地圖選點</button></div>
    <ul class="sugg" id="suO" hidden></ul>
  </div>
  <div class="hrow"><div class="inp"><input id="qD" type="text" placeholder="今日想去邊？" autocomplete="off" enterkeyhint="search" aria-label="終點"><button type="button" class="x" id="xD" aria-label="清除終點內容" hidden>×</button></div><button type="button" class="b mapbtn" id="mapD">地圖選點</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* ============ 純計算部分（不碰畫面，方便單獨測試）BEGIN_LOGIC ============ */
const KMB = 'https://data.etabus.gov.hk/v1/transport/kmb';
const CTB = 'https://rt.data.gov.hk/v2/transport/citybus';
const WALK_M_PER_MIN = 75, DETOUR = 1.25, RIDE_SEC_PER_STOP = 90;
const WAIT_EST = 240;          // 粗略篩選時，每次上車假設等 4 分鐘（只用來排先後，最後結果全部用實時資料）
const TRANSFER_BUF_MS = 2 * 60000; // 轉乘安全空隙：2 分鐘（只用於轉乘班次，首程不用） // 轉乘空隙：下車步行到轉乘站後，最少要多 3 分鐘才有下一班車
const CTB_GAP = 3;             // 城巴：追蹤同一班車時，每隔幾個站查一次到站時間
const DWELL_SEC = 20, BUS_MPS = 6; // 粗略篩選時的行車速度（約每小時 21.6 公里，含停站）

function hav(lat1, lon1, lat2, lon2) {
  const R = 6371000, p = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * p / 2) ** 2 +
    Math.cos(lat1 * p) * Math.cos(lat2 * p) * Math.sin((lon2 - lon1) * p / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function walkMin(m) { return Math.max(1, Math.ceil(m * DETOUR / WALK_M_PER_MIN)); }
/* 轉車步行：幾乎同一個位置就當作 0 分鐘 */
function walkTr(m) { return m < SAME_STOP_M ? 0 : walkMin(m); }
const SAME_STOP_M = 100; // 相距不足 100 米的站視為同一個站
/* ---------- 真實步行距離：地政總署 Map API 行人路線。查到就用，查不到就退回直線估算 ---------- */
const PED = 'https://mapapi.hkmapservice.gov.hk/PedRoute/NAServer/route/';
const pedCache = new Map(), pedPath = new Map(); let pedMode = null, pedFails = 0, pedOk = 0;
const pedKey = (a, b) => a.lat.toFixed(5) + ',' + a.lng.toFixed(5) + '|' + b.lat.toFixed(5) + ',' + b.lng.toFixed(5);
function realMin(a, b, fbM, transfer) {
  const m = pedCache.get(pedKey(a, b));
  if (m === undefined) return transfer ? walkTr(fbM) : walkMin(fbM);
  return (transfer && m < SAME_STOP_M) ? 0 : Math.max(1, Math.ceil(m / WALK_M_PER_MIN));
}
async function pedRoute(a, b) {
  const key = pedKey(a, b);
  if (pedCache.has(key) || (pedFails >= 6 && !pedOk)) return;
  try {
    if (pedMode === null) {
      const m = await getJSON(PED + 'retrieveTravelModes?f=json', 15000, 1);
      const x = (m.supportedTravelModes || [])[0]; // 第一項是「最短路徑」
      pedMode = x ? (x.id ?? x.itemId ?? x.name) : 1;
      if (typeof pedMode === 'object') pedMode = JSON.stringify(pedMode);
    }
    const stops = { features: [a, b].map((q, i) => ({ attributes: { Name: 'P' + i }, geometry: { spatialReference: { latestWkid: 4326 }, x: q.lng, y: q.lat } })) };
    const r = await getJSON(PED + 'solve?stops=' + encodeURIComponent(JSON.stringify(stops)) + '&travelMode=' + encodeURIComponent(pedMode) + '&directionsLanguage=zh-HK&outSR=4326&f=json&returnZ=true&returnDirections=false&returnRoutes=true', 15000, 1);
    const f = r.routes && r.routes.features && r.routes.features[0];
    let len = 0; const line = [];
    if (f) for (const path of (f.geometry.paths || [])) for (let i = 0; i < path.length; i++) { line.push([path[i][1], path[i][0]]); if (i) len += hav(path[i - 1][1], path[i - 1][0], path[i][1], path[i][0]); }
    if (len > 0) { pedCache.set(key, len); pedPath.set(key, line); pedOk++; } else pedFails++;
  } catch (e) { pedFails++; }
}
async function prefetchWalk(pairs, label) {
  const seen = new Set(), todo = [];
  for (const [a, b] of pairs) {
    if (!a || !b) continue;
    const k = pedKey(a, b);
    if (seen.has(k) || pedCache.has(k) || hav(a.lat, a.lng, b.lat, b.lng) < SAME_STOP_M) continue;
    seen.add(k); todo.push([a, b]);
  }
  if (!todo.length) return;
  let done = 0;
  setStatus(label + '（0／' + todo.length + '）');
  await Promise.race([
    pool(todo, 6, ([a, b]) => pedRoute(a, b), () => { done++; if (done % 10 === 0) setStatus(label + '（' + done + '／' + todo.length + '）'); }),
    new Promise(r => setTimeout(r, 8000))
  ]);
}

function nearStops(stops, lat, lng, r) {
  const out = new Map();
  for (const [id, s] of stops) {
    const d = hav(lat, lng, s.lat, s.lng);
    if (d <= r) out.set(id, d);
  }
  return out;
}

/* ---- 官方資料（data.gov.hk 公布的九巴／龍運、城巴介面）整理成統一格式 ----
   routes: [{id,route,co:[co],stops:{co:[站 id，依站序]},bound:{co:'O'|'I'},orig,dest,st}]
   stops:  {站 id: [名稱, 緯度, 經度]} */
function kmbDb(rj, sj, rsj) {
  const stops = {};
  for (const s of sj.data) {
    const lat = parseFloat(s.lat), lng = parseFloat(s.long);
    if (isFinite(lat) && isFinite(lng)) stops[s.stop] = [s.name_tc || s.name_en || s.stop, lat, lng];
  }
  const rmap = new Map();
  for (const r of rj.data) {
    if (String(r.service_type) !== '1') continue; // 只用主要班次，特別班次略過
    rmap.set(r.route + '|' + r.bound, { id: 'kmb|' + r.route + '|' + r.bound, route: r.route, bound: r.bound, orig: r.orig_tc, dest: r.dest_tc, arr: [] });
  }
  for (const x of rsj.data) {
    if (String(x.service_type) !== '1') continue;
    const r = rmap.get(x.route + '|' + x.bound);
    const q = parseInt(x.seq, 10);
    if (r && q >= 1 && q <= 1000) r.arr[q - 1] = x.stop;
  }
  const routes = [];
  for (const r of rmap.values()) {
    const a = Array.from(r.arr, x => x || ''); // 站序有缺口時用空字串佔位，保持站序位置正確
    if (a.length < 2) continue;
    routes.push({ id: r.id, route: r.route, co: ['kmb'], stops: { kmb: a }, bound: { kmb: r.bound }, orig: r.orig, dest: r.dest, st: '1' });
  }
  return { routes, stops };
}
function ctbDb(list, rs, stopInfo) {
  const stops = {}, routes = [];
  for (const [id, s] of stopInfo) stops[id] = [s.name, s.lat, s.lng];
  for (const r of list) for (const dir of ['O', 'I']) {
    const a = rs.get(r.route + '|' + dir);
    if (!a || a.length < 2) continue;
    routes.push({
      id: 'ctb|' + r.route + '|' + dir, route: r.route, co: ['ctb'], stops: { ctb: a }, bound: { ctb: dir },
      orig: dir === 'O' ? r.orig_tc : r.dest_tc, dest: dir === 'O' ? r.dest_tc : r.orig_tc, st: '1'
    });
  }
  return { routes, stops };
}
function mergeDb(a, b) {
  return { routes: a.routes.concat(b.routes), stops: Object.assign({}, a.stops, b.stops) };
}

/* 建立路線網絡。route.stops = 有座標的車站 id；route.pos = 它在官方站序中的位置（0 起算） */
function buildNet(db) {
  const stops = new Map(), slist = [], sidx = new Map();
  for (const id in db.stops) {
    const [name, lat, lng] = db.stops[id];
    stops.set(id, { name, lat, lng });
    sidx.set(id, slist.length); slist.push(id);
  }
  const routes = [];
  for (const r of db.routes) {
    let cos = r.co.filter(c => r.stops[c] && r.stops[c].length > 1);
    if (!cos.length) continue;
    const main = cos[0], len = r.stops[main].length;
    cos = cos.filter(c => r.stops[c].length === len); // 聯營路線兩邊站數要一致才能對位
    const ids = [], pos = [];
    r.stops[main].forEach((id, k) => { if (stops.has(id)) { ids.push(id); pos.push(k); } });
    if (ids.length < 2) continue;
    const cum = [0];
    for (let k = 1; k < ids.length; k++) {
      const a = stops.get(ids[k - 1]), b = stops.get(ids[k]);
      cum.push(cum[k - 1] + DWELL_SEC + hav(a.lat, a.lng, b.lat, b.lng) * DETOUR / BUS_MPS);
    }
    routes.push({
      id: r.id, route: r.route, co: cos, main, stopsByCo: r.stops, bound: r.bound, st: r.st,
      orig: r.orig, dest: r.dest, stops: ids, pos, cum, sIdx: ids.map(x => sidx.get(x))
    });
  }
  const routesAt = slist.map(() => []);
  routes.forEach((r, ri) => r.sIdx.forEach((sx, k) => routesAt[sx].push([ri, k])));
  return { stops, slist, sidx, routes, routesAt, nbCache: new Map() };
}

/* 每個車站附近（步行範圍內）的其他車站，用格子加快搜尋 */
function neighborsOf(net, maxM) {
  if (net.nbCache.has(maxM)) return net.nbCache.get(maxM);
  const dLat = maxM / 111000, dLng = maxM / 102700;
  const grid = new Map();
  const key = (a, b) => a + ',' + b;
  net.slist.forEach((id, i) => {
    const s = net.stops.get(id);
    const k = key(Math.floor(s.lat / dLat), Math.floor(s.lng / dLng));
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  });
  const nb = net.slist.map(() => []);
  net.slist.forEach((id, i) => {
    const s = net.stops.get(id);
    const cy = Math.floor(s.lat / dLat), cx = Math.floor(s.lng / dLng);
    for (let y = cy - 1; y <= cy + 1; y++) for (let x = cx - 1; x <= cx + 1; x++) {
      for (const j of (grid.get(key(y, x)) || [])) {
        if (j === i) continue;
        const t = net.stops.get(net.slist[j]);
        const d = hav(s.lat, s.lng, t.lat, t.lng);
        if (d <= maxM) nb[i].push([j, d]);
      }
    }
  });
  net.nbCache.set(maxM, nb);
  return nb;
}

/* 直達：routes 內每條路線，找起點附近到終點附近最短的一段 */
function findDirect(routes, oNear, dNear) {
  const res = [];
  for (const r of routes) {
    let best = null;
    const byI = new Map(), ids = r.stops;
    for (let i = 0; i < ids.length; i++) {
      const dO = oNear.get(ids[i]);
      if (dO === undefined) continue;
      for (let j = i + 1; j < ids.length; j++) {
        const dD = dNear.get(ids[j]);
        if (dD === undefined) continue;
        const est = walkMin(dO) * 60 + (r.cum ? r.cum[j] - r.cum[i] : (j - i) * RIDE_SEC_PER_STOP) + walkMin(dD) * 60;
        if (!best || est < best.est) best = { i, j, dO, dD, est };
        const cur = byI.get(i); if (!cur || est < cur.est) byI.set(i, { i, j, dO, dD, est });
      }
    }
    if (best) {
      const mk = (b, alt) => ({ legs: [{ r, i: b.i, j: b.j }], dO: b.dO, dD: b.dD, est: b.est + WAIT_EST, alt });
      res.push(mk(best, false));
      // 城巴要逐站查到站時間：最佳上車站查不到或趕不上時，再試另外兩個上車站
      if (!isKmb(r)) [...byI.values()].filter(b => b.i !== best.i).sort((a, b) => a.est - b.est).slice(0, 2).forEach(b => res.push(mk(b, true)));
    }
  }
  res.sort((a, b) => a.est - b.est);
  return res;
}

/* 轉車：每一輪多搭一程巴士（RAPTOR 的簡化版，時間用粗略估算，只用來篩選）。 */
function raptor(net, oNear, maxRides, transferM) {
  const n = net.slist.length, INF = 1e12;
  const nb = neighborsOf(net, transferM);
  let prev = new Float64Array(n).fill(INF);
  for (const [id, d] of oNear) { const k = net.sidx.get(id); if (k !== undefined) prev[k] = walkMin(d) * 60; }
  const rounds = [];
  for (let k = 1; k <= maxRides; k++) {
    const bus = new Float64Array(n).fill(INF), par = new Array(n);
    for (let ri = 0; ri < net.routes.length; ri++) {
      const r = net.routes[ri], idx = r.sIdx, cum = r.cum;
      let bi = -1, bt = INF;
      for (let j = 0; j < idx.length; j++) {
        const s = idx[j];
        if (bi >= 0) {
          const arr = bt + (cum[j] - cum[bi]);
          if (arr < bus[s]) { bus[s] = arr; par[s] = { ri, i: bi, j }; }
        }
        if (prev[s] < INF) {
          const cand = prev[s] + WAIT_EST;
          if (bi < 0 || cand < bt + (cum[j] - cum[bi])) { bi = j; bt = cand; }
        }
      }
    }
    const cur = Float64Array.from(bus), footPar = new Array(n);
    for (let s = 0; s < n; s++) {
      if (bus[s] >= INF) continue;
      for (const [t, d] of nb[s]) {
        const c = bus[s] + walkTr(d) * 60;
        if (c < cur[t]) { cur[t] = c; footPar[t] = s; }
      }
    }
    rounds.push({ bus, par, cur, footPar });
    prev = cur;
  }
  return rounds;
}
/* 從第 k 輪的某個終點車站倒推整條行程 */
function reconstruct(net, rounds, k, s) {
  const legs = [];
  let kk = k, cur = s;
  while (kk >= 1) {
    const R = rounds[kk - 1], p = R.par[cur];
    if (!p) return null;
    const r = net.routes[p.ri];
    legs.unshift({ r, i: p.i, j: p.j });
    const boardIdx = net.sidx.get(r.stops[p.i]);
    kk--;
    if (kk >= 1) { const fp = rounds[kk - 1].footPar[boardIdx]; cur = fp !== undefined ? fp : boardIdx; }
  }
  return legs;
}
function transferPlans(net, rounds, oNear, dNear, kMin) {
  const out = new Map();
  for (let k = kMin || 2; k <= rounds.length; k++) {
    for (const [dId, dD] of dNear) {
      const s = net.sidx.get(dId);
      if (s === undefined || rounds[k - 1].bus[s] >= 1e11) continue;
      const legs = reconstruct(net, rounds, k, s);
      if (!legs) continue;
      const names = legs.map(l => l.r.route);
      if (new Set(names).size !== names.length) continue; // 同一條路線搭兩次沒意義
      const oId = legs[0].r.stops[legs[0].i];
      const dO = oNear.get(oId);
      if (dO === undefined) continue;
      const est = rounds[k - 1].bus[s] + walkMin(dD) * 60;
      const sig = legs.map(l => l.r.id).join('>');
      const old = out.get(sig);
      if (!old || est < old.est) out.set(sig, { legs, dO, dD, est });
    }
  }
  return [...out.values()].sort((a, b) => a.est - b.est);
}

/* 轉乘一次（兩程巴士）：把所有「第一程在起點附近上車、第二程到終點附近」的路線配對都找出來，
   每一對選一個最合適的轉車站。時間只是粗略估算，用來決定先查哪些，最後結果全部用實時到站資料。 */
function twoLegPlans(net, oNear, dNear, trM) {
  const nb = neighborsOf(net, trM);
  const dRoute = new Map();
  for (let ri = 0; ri < net.routes.length; ri++) {
    const r = net.routes[ri];
    const ba = new Array(r.stops.length).fill(null);
    let bestV = Infinity, bestM = -1, any = false;
    for (let m = r.stops.length - 1; m >= 0; m--) {
      if (bestM >= 0) ba[m] = { m: bestM, v: bestV - r.cum[m] }; // 從 m 上車，到終點附近最好的下車站（行車＋步行秒數）
      const dd = dNear.get(r.stops[m]);
      if (dd !== undefined) { any = true; const v = r.cum[m] + walkMin(dd) * 60; if (v < bestV) { bestV = v; bestM = m; } }
    }
    if (any) dRoute.set(ri, ba);
  }
  const out = new Map();
  for (let ri1 = 0; ri1 < net.routes.length; ri1++) {
    const r1 = net.routes[ri1];
    let bi = -1, bd = Infinity;
    for (let i = 0; i < r1.stops.length - 1; i++) {
      const d = oNear.get(r1.stops[i]);
      if (d !== undefined && d < bd) { bd = d; bi = i; }
    }
    if (bi < 0) continue;
    const oWalk = walkMin(bd) * 60;
    for (let j = bi + 1; j < r1.stops.length; j++) {
      const s = r1.sIdx[j];
      const cands = [[s, 0]].concat(nb[s]);
      for (const [b, d] of cands) {
        for (const [ri2, k] of net.routesAt[b]) {
          if (ri2 === ri1) continue;
          const ba = dRoute.get(ri2);
          if (!ba || !ba[k]) continue;
          const r2 = net.routes[ri2];
          if (r2.route === r1.route) continue;
          const est = oWalk + (r1.cum[j] - r1.cum[bi]) + walkTr(d) * 60 + 2 * WAIT_EST + ba[k].v;
          const key = ri1 + '>' + ri2, old = out.get(key);
          if (!old || est < old.est)
            out.set(key, { legs: [{ r: r1, i: bi, j }, { r: r2, i: k, j: ba[k].m }], dO: bd, dD: dNear.get(r2.stops[ba[k].m]), est });
        }
      }
    }
  }
  return [...out.values()].sort((a, b) => a.est - b.est);
}

/* ---- 實時到站 ---- */
function etaBySeq(records, bound, st) {
  const by = new Map();
  for (const x of records) {
    if (x.dir !== bound || String(x.service_type) !== String(st) || !x.eta) continue;
    const t = Date.parse(x.eta);
    if (!isFinite(t)) continue;
    if (!by.has(x.seq)) by.set(x.seq, []);
    by.get(x.seq).push({ t, rmk: x.rmk_tc || '', src: 'kmb' });
  }
  for (const arr of by.values()) arr.sort((p, q) => p.t - q.t);
  return by;
}
/* 要查的到站資料：九巴一次查整條路線；城巴要逐個車站查，沿途每隔幾個站查一次 */
function sampleIdx(i, j, g) {
  const n = Math.max(1, Math.ceil((j - i) / g)), out = [i];
  for (let q = 1; q < n; q++) { const p = i + Math.round(q * (j - i) / n); if (p > out[out.length - 1] && p < j) out.push(p); }
  out.push(j);
  return out;
}

  const k = arr.findIndex(x => x.t >= tMin);

  if (!allowSynth || arr.length < 2) return null;

  for (let q = 1; q < arr.length; q++) gaps.push(arr[q].t - arr[q - 1].t);
  gaps.sort((a, b) => a - b);

function parseALS(xml, DOMParserCls) {
  const doc = new DOMParserCls().parseFromString(xml, 'text/xml');
  const out = [];
  for (const n of Array.from(doc.getElementsByTagName('SuggestedAddress'))) {
    const g = (root, tag) => { const e = root && root.getElementsByTagName(tag)[0]; return e && e.textContent ? e.textContent.trim() : ''; };
    const lat = parseFloat(g(n, 'Latitude')), lng = parseFloat(g(n, 'Longitude'));
    if (!isFinite(lat) || !isFinite(lng)) continue;
    const chi = n.getElementsByTagName('ChiPremisesAddress')[0];
    const eng = n.getElementsByTagName('EngPremisesAddress')[0];
    const src = chi || eng;
    const parts = [g(src, 'BuildingName'), g(src, 'EstateName'),
      (g(src, 'StreetName') + g(src, 'BuildingNoFrom')), g(src, 'DcDistrict')].filter(Boolean);
    out.push({ label: parts.join(' ') || '（未命名地點）', lat, lng });
  }
  return out;
}

async function pool(items, n, fn, onDone) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = items[i++]; await fn(k); if (onDone) onDone(); }
  }));
}
async function fetchEta(key, store) {

}

  const save = () => { try { const o = {}; ids.forEach(id => { o[id] = $('#' + id).value; }); localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* 存不了也沒關係 */ } };
  ids.forEach(id => { const el = $('#' + id); if (saved[id] != null && [...el.options].some(o => o.value === saved[id])) el.value = saved[id]; el.addEventListener('change', save); });
}
setTimeout(() => { const redraw = () => { try { if (current && current.length && searchState) renderResults(); } catch (e) { /* 忽略 */ } }; loadFares().then(() => { try { applyJourneyTimes(); } catch (e) { /* 忽略 */ } redraw(); }).catch(() => {}).then(() => loadSection()).then(redraw).catch(() => {}); }, 3000);
</script>
</body>
</html>
