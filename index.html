<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樂悠巴</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --fg:#16212b; --muted:#5d6b76; --line:#d9ded8;
  --accent:#0d7a69; --accent-fg:#ffffff; --warn:#a85f00; --bad:#b3261e; --good:#1b7a3a;
  --soft:#e6efec; --stop:#2a5db0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10171d; --card:#18222b; --fg:#e8edf0; --muted:#9aa8b2; --line:#2b3944;
    --accent:#3fc2aa; --accent-fg:#06211c; --warn:#f0b254; --bad:#ff8a80; --good:#7fd69a;
    --soft:#1f3a36; --stop:#7aa7ee; color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","Noto Sans CJK TC","PingFang HK","Microsoft JhengHei",sans-serif;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:max(24px,env(safe-area-inset-bottom,0px));}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 8px}
header h1{margin:0;font-size:24px;letter-spacing:.04em}
header .ver{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font:inherit;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row input[type=text]{flex:1 1 180px;min-width:0}
input[type=text],select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button.b{padding:9px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;font:inherit}
button.b:active{background:var(--soft)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;padding:12px;width:100%;font-size:16px}
button:disabled{opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sugg{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sugg li button{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.sugg li:last-child button{border-bottom:0}
.sugg .src{font-size:11px;color:var(--muted);margin-left:6px}
.hint{font-size:13px;color:var(--muted)}
.banner{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px}
details{margin:2px 0 10px}
summary{cursor:pointer;color:var(--muted);font-weight:600;padding:4px 0}
details .field{margin-top:8px}
#mapWrap{position:relative;margin-bottom:10px}
#map{height:46vh;min-height:300px;border-radius:10px;border:1px solid var(--line);z-index:0}
#mapWrap.full{position:fixed;inset:0;z-index:2000;margin:0;background:var(--bg)}
#mapWrap.full #map{height:100%;min-height:0;border-radius:0;border:0}
.pickbar{position:absolute;left:0;right:0;z-index:1500;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pickbar.top{top:0;padding-top:max(10px,env(safe-area-inset-top,0px))}
.pickbar.bottom{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.pickbar span{flex:1;min-width:0;overflow-wrap:anywhere}
.pickbar button{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-weight:700}
.pickbar button.ok{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pin{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.o{background:#1b7a3a}.pin.d{background:#b3261e}.pin.u{background:#2a5db0}.pin.x{background:#6b4aa8}.pin.t{background:#444}
.res{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card);cursor:pointer}
.res[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.res .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.res .tot{font-size:17px}.res .tot b{font-size:24px;font-variant-numeric:tabular-nums}
.res .nx{font-size:14px;color:var(--muted);white-space:nowrap}
.eta{display:inline-block;padding:2px 10px;border-radius:8px;font-size:22px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums;vertical-align:middle}
.eta.y{background:#f7c600;color:#2b2200}
.eta.g{background:#1f9d55;color:#fff}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--soft);margin-left:4px;vertical-align:middle}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.res .line{margin:6px 0}.res .sub{font-size:13px;color:var(--muted);margin-top:2px}
.rt{display:inline-block;padding:0 7px;border-radius:5px;background:var(--stop);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.rt{color:#0c1620}}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a{display:inline-block;padding:8px 10px;border:1px solid var(--accent);color:var(--accent);border-radius:8px;text-decoration:none;font-weight:600}
.diag li{padding:8px 0;border-bottom:1px solid var(--line);list-style:none;overflow-wrap:anywhere}
.diag{padding:0;margin:0}
.ok{color:var(--good);font-weight:700}.ng{color:var(--bad);font-weight:700}.run{color:var(--muted)}
textarea{width:100%;min-height:140px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:12px/1.4 ui-monospace,monospace}
.leaflet-container{font:inherit}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>樂悠巴</h1><span class="ver">測試版 v4</span></header>
<div id="envWarn" class="banner" hidden></div>
<div class="tabs" role="tablist">
  <button id="tabSearch" role="tab" aria-selected="true">查路線</button>
  <button id="tabDiag" role="tab" aria-selected="false">資料測試</button>
</div>

<section id="paneSearch">
  <div class="card">
    <div class="field">
      <label for="qO">起點</label>
      <div class="row"><input id="qO" type="text" value="目前位置" autocomplete="off" enterkeyhint="search"><button class="b" id="mapO">在地圖點選</button></div>
      <ul class="sugg" id="suO" hidden></ul>
    </div>
    <div class="field">
      <label for="qD">終點</label>
      <div class="row"><input id="qD" type="text" placeholder="想去邊？" autocomplete="off" enterkeyhint="search"><button class="b" id="mapD">在地圖點選</button></div>
      <ul class="sugg" id="suD" hidden></ul>
    </div>
    <div class="row" style="margin-bottom:8px"><button class="b" id="gpsO">起點用目前位置</button><button class="b" id="swap">起終點互換</button></div>
    <details>
      <summary>更多設定</summary>
      <div class="field"><label for="maxTr">最多轉車次數</label>
        <select id="maxTr"><option value="0">不轉車（只看直達）</option><option value="1">1 次</option><option value="2">2 次</option><option value="3" selected>3 次</option><option value="4">4 次</option><option value="5">5 次</option></select></div>
      <div class="field"><label for="trWalk">轉車時最多步行</label>
        <select id="trWalk"><option value="3">3 分鐘</option><option value="5" selected>5 分鐘</option><option value="8">8 分鐘</option><option value="10">10 分鐘</option></select></div>
      <div class="field"><label for="rad">起點、終點旁邊找巴士站的範圍</label>
        <select id="rad"><option value="500">500 米</option><option value="800">800 米</option><option value="1000" selected>1 公里</option><option value="1500">1.5 公里</option></select></div>
    </details>
    <button class="primary" id="go" disabled>搜索巴士</button>
    <p class="hint" id="status" role="status">先設定終點。</p>
  </div>
  <div id="mapWrap">
    <div id="map" aria-label="地圖"></div>
    <div class="pickbar top" id="pickTop" hidden><span id="pickMsg"></span><button type="button" id="pickCancel">取消</button></div>
    <div class="pickbar bottom" id="pickBottom" hidden><span id="pickLabel">請點一下地圖</span><button type="button" class="ok" id="pickOk" disabled>確定</button></div>
  </div>
  <div id="selInfo"></div>
  <div id="results"></div>
</section>

<section id="paneDiag" hidden>
  <div class="card">
    <p style="margin-top:0">這一頁檢查程式能不能讀到巴士路線和到站資料。按一下開始測試，完成後按「複製結果」，貼給我就可以。</p>
    <div class="row"><button class="b primary" id="runDiag" style="width:auto">開始測試</button><button class="b" id="copyDiag">複製結果</button></div>
    <ul class="diag" id="diagList"></ul>
    <textarea id="diagText" hidden readonly aria-label="測試結果文字"></textarea>
  </div>
</section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* ============ 純計算部分（不碰畫面，方便單獨測試）BEGIN_LOGIC ============ */
const KMB = 'https://data.etabus.gov.hk/v1/transport/kmb';
const CTB = 'https://rt.data.gov.hk/v2/transport/citybus';
const WALK_M_PER_MIN = 75, DETOUR = 1.25, RIDE_SEC_PER_STOP = 90;
const WAIT_EST = 300;          // 粗略篩選時，每次上車假設等 5 分鐘
const DWELL_SEC = 20, BUS_MPS = 6; // 粗略篩選時的行車速度（約每小時 21.6 公里，含停站）

function hav(lat1, lon1, lat2, lon2) {
  const R = 6371000, p = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * p / 2) ** 2 +
    Math.cos(lat1 * p) * Math.cos(lat2 * p) * Math.sin((lon2 - lon1) * p / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function walkMin(m) { return Math.max(1, Math.ceil(m * DETOUR / WALK_M_PER_MIN)); }
/* 轉車步行：幾乎同一個位置就當作 0 分鐘 */
function walkTr(m) { return m < 25 ? 0 : walkMin(m); }

function nearStops(stops, lat, lng, r) {
  const out = new Map();
  for (const [id, s] of stops) {
    const d = hav(lat, lng, s.lat, s.lng);
    if (d <= r) out.set(id, d);
  }
  return out;
}

/* ---- 整合資料（hk-bus-crawling 每日整理）縮減成只剩九巴／龍運／城巴 ---- */
function trimDb(raw) {
  const routes = [], need = new Set();
  for (const [id, r] of Object.entries(raw.routeList || {})) {
    const st = {}, bound = {};
    for (const c of (r.co || [])) {
      const k = String(c).toLowerCase();
      if (k !== 'kmb' && k !== 'ctb') continue;
      const arr = r.stops && r.stops[c];
      if (!Array.isArray(arr) || arr.length < 2) continue;
      st[k] = arr; bound[k] = (r.bound && (r.bound[c] || r.bound[k])) || 'O';
      arr.forEach(x => need.add(x));
    }
    const cos = Object.keys(st);
    if (!cos.length) continue;
    routes.push({
      id, route: String(r.route), co: cos, stops: st, bound,
      orig: (r.orig && (r.orig.zh || r.orig.en)) || '', dest: (r.dest && (r.dest.zh || r.dest.en)) || '',
      st: r.serviceType == null ? 1 : r.serviceType
    });
  }
  const stops = {};
  for (const id of need) {
    const s = raw.stopList && raw.stopList[id];
    if (s && s.location && isFinite(+s.location.lat) && isFinite(+s.location.lng))
      stops[id] = [(s.name && (s.name.zh || s.name.en)) || id, +s.location.lat, +s.location.lng];
  }
  return { routes, stops };
}

/* 建立路線網絡。route.stops = 有座標的車站 id；route.pos = 它在官方站序中的位置（0 起算） */
function buildNet(db) {
  const stops = new Map(), slist = [], sidx = new Map();
  for (const id in db.stops) {
    const [name, lat, lng] = db.stops[id];
    stops.set(id, { name, lat, lng });
    sidx.set(id, slist.length); slist.push(id);
  }
  const routes = [];
  for (const r of db.routes) {
    let cos = r.co.filter(c => r.stops[c] && r.stops[c].length > 1);
    if (!cos.length) continue;
    const main = cos[0], len = r.stops[main].length;
    cos = cos.filter(c => r.stops[c].length === len); // 聯營路線兩邊站數要一致才能對位
    const ids = [], pos = [];
    r.stops[main].forEach((id, k) => { if (stops.has(id)) { ids.push(id); pos.push(k); } });
    if (ids.length < 2) continue;
    const cum = [0];
    for (let k = 1; k < ids.length; k++) {
      const a = stops.get(ids[k - 1]), b = stops.get(ids[k]);
      cum.push(cum[k - 1] + DWELL_SEC + hav(a.lat, a.lng, b.lat, b.lng) * DETOUR / BUS_MPS);
    }
    routes.push({
      id: r.id, route: r.route, co: cos, main, stopsByCo: r.stops, bound: r.bound, st: r.st,
      orig: r.orig, dest: r.dest, stops: ids, pos, cum, sIdx: ids.map(x => sidx.get(x))
    });
  }
  return { stops, slist, sidx, routes, nbCache: new Map() };
}

/* 每個車站附近（步行範圍內）的其他車站，用格子加快搜尋 */
function neighborsOf(net, maxM) {
  if (net.nbCache.has(maxM)) return net.nbCache.get(maxM);
  const dLat = maxM / 111000, dLng = maxM / 102700;
  const grid = new Map();
  const key = (a, b) => a + ',' + b;
  net.slist.forEach((id, i) => {
    const s = net.stops.get(id);
    const k = key(Math.floor(s.lat / dLat), Math.floor(s.lng / dLng));
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  });
  const nb = net.slist.map(() => []);
  net.slist.forEach((id, i) => {
    const s = net.stops.get(id);
    const cy = Math.floor(s.lat / dLat), cx = Math.floor(s.lng / dLng);
    for (let y = cy - 1; y <= cy + 1; y++) for (let x = cx - 1; x <= cx + 1; x++) {
      for (const j of (grid.get(key(y, x)) || [])) {
        if (j === i) continue;
        const t = net.stops.get(net.slist[j]);
        const d = hav(s.lat, s.lng, t.lat, t.lng);
        if (d <= maxM) nb[i].push([j, d]);
      }
    }
  });
  net.nbCache.set(maxM, nb);
  return nb;
}

/* 直達：routes 內每條路線，找起點附近到終點附近最短的一段 */
function findDirect(routes, oNear, dNear) {
  const res = [];
  for (const r of routes) {
    let best = null;
    const ids = r.stops;
    for (let i = 0; i < ids.length; i++) {
      const dO = oNear.get(ids[i]);
      if (dO === undefined) continue;
      for (let j = i + 1; j < ids.length; j++) {
        const dD = dNear.get(ids[j]);
        if (dD === undefined) continue;
        const est = walkMin(dO) * 60 + (r.cum ? r.cum[j] - r.cum[i] : (j - i) * RIDE_SEC_PER_STOP) + walkMin(dD) * 60;
        if (!best || est < best.est) best = { i, j, dO, dD, est };
      }
    }
    if (best) res.push({ legs: [{ r, i: best.i, j: best.j }], dO: best.dO, dD: best.dD, est: best.est + WAIT_EST });
  }
  res.sort((a, b) => a.est - b.est);
  return res;
}

/* 轉車：每一輪多搭一程巴士（RAPTOR 的簡化版，時間用粗略估算，只用來篩選）。 */
function raptor(net, oNear, maxRides, transferM) {
  const n = net.slist.length, INF = 1e12;
  const nb = neighborsOf(net, transferM);
  let prev = new Float64Array(n).fill(INF);
  for (const [id, d] of oNear) { const k = net.sidx.get(id); if (k !== undefined) prev[k] = walkMin(d) * 60; }
  const rounds = [];
  for (let k = 1; k <= maxRides; k++) {
    const bus = new Float64Array(n).fill(INF), par = new Array(n);
    for (let ri = 0; ri < net.routes.length; ri++) {
      const r = net.routes[ri], idx = r.sIdx, cum = r.cum;
      let bi = -1, bt = INF;
      for (let j = 0; j < idx.length; j++) {
        const s = idx[j];
        if (bi >= 0) {
          const arr = bt + (cum[j] - cum[bi]);
          if (arr < bus[s]) { bus[s] = arr; par[s] = { ri, i: bi, j }; }
        }
        if (prev[s] < INF) {
          const cand = prev[s] + WAIT_EST;
          if (bi < 0 || cand < bt + (cum[j] - cum[bi])) { bi = j; bt = cand; }
        }
      }
    }
    const cur = Float64Array.from(bus), footPar = new Array(n);
    for (let s = 0; s < n; s++) {
      if (bus[s] >= INF) continue;
      for (const [t, d] of nb[s]) {
        const c = bus[s] + walkTr(d) * 60;
        if (c < cur[t]) { cur[t] = c; footPar[t] = s; }
      }
    }
    rounds.push({ bus, par, cur, footPar });
    prev = cur;
  }
  return rounds;
}
/* 從第 k 輪的某個終點車站倒推整條行程 */
function reconstruct(net, rounds, k, s) {
  const legs = [];
  let kk = k, cur = s;
  while (kk >= 1) {
    const R = rounds[kk - 1], p = R.par[cur];
    if (!p) return null;
    const r = net.routes[p.ri];
    legs.unshift({ r, i: p.i, j: p.j });
    const boardIdx = net.sidx.get(r.stops[p.i]);
    kk--;
    if (kk >= 1) { const fp = rounds[kk - 1].footPar[boardIdx]; cur = fp !== undefined ? fp : boardIdx; }
  }
  return legs;
}
function transferPlans(net, rounds, oNear, dNear) {
  const out = new Map();
  for (let k = 2; k <= rounds.length; k++) {
    for (const [dId, dD] of dNear) {
      const s = net.sidx.get(dId);
      if (s === undefined || rounds[k - 1].bus[s] >= 1e11) continue;
      const legs = reconstruct(net, rounds, k, s);
      if (!legs) continue;
      const names = legs.map(l => l.r.route);
      if (new Set(names).size !== names.length) continue; // 同一條路線搭兩次沒意義
      const oId = legs[0].r.stops[legs[0].i];
      const dO = oNear.get(oId);
      if (dO === undefined) continue;
      const est = rounds[k - 1].bus[s] + walkMin(dD) * 60;
      const sig = legs.map(l => l.r.id).join('>');
      const old = out.get(sig);
      if (!old || est < old.est) out.set(sig, { legs, dO, dD, est });
    }
  }
  return [...out.values()].sort((a, b) => a.est - b.est);
}

/* ---- 實時到站 ---- */
function etaBySeq(records, bound, st) {
  const by = new Map();
  for (const x of records) {
    if (x.dir !== bound || String(x.service_type) !== String(st) || !x.eta) continue;
    const t = Date.parse(x.eta);
    if (!isFinite(t)) continue;
    if (!by.has(x.seq)) by.set(x.seq, []);
    by.get(x.seq).push({ t, rmk: x.rmk_tc || '', src: 'kmb' });
  }
  for (const arr of by.values()) arr.sort((p, q) => p.t - q.t);
  return by;
}
/* 跟著同一班車：已知它在第 a 站的時間 t0，找出它之後每一站的預計時間。
   官方資料沒有車輛編號，所以用「時間先後」判斷：
   下一站的時間必須晚於上一站，而且早於後面那班車到上一站的時間。 */
function followSteps(by, a, t0, maxSeq) {
  const times = [t0];
  let t = t0;
  for (let s = a + 1; s <= maxSeq; s++) {
    const prevList = by.get(s - 1) || [];
    const nextAtPrev = prevList.find(x => x.t > t);
    const limit = nextAtPrev ? nextAtPrev.t : Infinity;
    const cand = (by.get(s) || []).find(x => x.t > t && x.t < limit);
    if (!cand) break;
    t = cand.t;
    times.push(t);
  }
  return times;
}
function followBus(by, a, t0, b) {
  const times = followSteps(by, a, t0, b);
  return times.length === b - a + 1 ? times[times.length - 1] : null;
}

/* 一程巴士在上車站的到站列表（九巴＋城巴合併）。沒有任何資料來源時回傳 null */
function etaKeys(r, i) {
  const keys = [];
  for (const co of r.co) {
    if (co === 'kmb') keys.push('k|' + r.route + '|' + r.st);
    else if (co === 'ctb') keys.push('c|' + r.stopsByCo.ctb[r.pos[i]] + '|' + r.route);
  }
  return keys;
}
function legEtas(r, i, store) {
  const out = []; let any = false;
  for (const co of r.co) {
    if (co === 'kmb') {
      const data = store.get('k|' + r.route + '|' + r.st);
      if (!data) continue;
      any = true;
      const by = etaBySeq(data, r.bound.kmb, r.st);
      for (const x of (by.get(r.pos[i] + 1) || [])) out.push(x);
    } else if (co === 'ctb') {
      const data = store.get('c|' + r.stopsByCo.ctb[r.pos[i]] + '|' + r.route);
      if (!data) continue;
      any = true;
      for (const x of data) {
        if (!x.eta || x.dir !== r.bound.ctb) continue;
        const t = Date.parse(x.eta);
        if (isFinite(t)) out.push({ t, rmk: x.rmk_tc || '', src: 'ctb' });
      }
    }
  }
  if (!any) return null;
  return out.sort((a, b) => a.t - b.t);
}
function planKeys(plan) {
  const ks = [];
  for (const L of plan.legs) for (const k of etaKeys(L.r, L.i)) ks.push(k);
  return ks;
}

/* 用實時資料精算一個方案。沒有到站資料、或趕不上任何一班車，就回傳 drop（不顯示） */
function evalPlan(plan, ctx) {
  const { now, store, stops } = ctx;
  const walkO = walkTr(plan.dO) || 1;
  let t = now + walkO * 60000, estimated = false;
  const legs = [];
  for (let n = 0; n < plan.legs.length; n++) {
    const L = plan.legs[n], r = L.r;
    const arr = legEtas(r, L.i, store);
    if (!arr) return { drop: 'nodata', route: r.route };
    const pick = arr.find(x => x.t >= t);
    if (!pick) return { drop: 'nobus', route: r.route };
    let tAl = null, est = false;
    if (pick.src === 'kmb') {
      const data = store.get('k|' + r.route + '|' + r.st);
      const by = etaBySeq(data, r.bound.kmb, r.st);
      tAl = followBus(by, r.pos[L.i] + 1, pick.t, r.pos[L.j] + 1);
    }
    if (tAl == null) { tAl = pick.t + (r.cum[L.j] - r.cum[L.i]) * 1000; est = true; estimated = true; }
    const leg = { r, i: L.i, j: L.j, board: pick, arrive: tAl, est, wait: pick.t - t, nextMin: Math.round((pick.t - now) / 60000), nStops: L.j - L.i, walkAfter: 0 };
    legs.push(leg);
    t = tAl;
    if (n + 1 < plan.legs.length) {
      const nx = plan.legs[n + 1];
      const a = stops.get(r.stops[L.j]), b = stops.get(nx.r.stops[nx.i]);
      leg.walkAfter = walkTr(hav(a.lat, a.lng, b.lat, b.lng));
      t += leg.walkAfter * 60000;
    }
  }
  const wD = walkMin(plan.dD);
  legs[legs.length - 1].walkAfter = wD;
  const tEnd = t + wD * 60000;
  return { legs, walkO, tEnd, totalSec: (tEnd - now) / 1000, estimated, transfers: legs.length - 1 };
}

/* 香港政府地址搜尋（XML）-> [{label,lat,lng}] */
function parseALS(xml, DOMParserCls) {
  const doc = new DOMParserCls().parseFromString(xml, 'text/xml');
  const out = [];
  for (const n of Array.from(doc.getElementsByTagName('SuggestedAddress'))) {
    const g = (root, tag) => { const e = root && root.getElementsByTagName(tag)[0]; return e && e.textContent ? e.textContent.trim() : ''; };
    const lat = parseFloat(g(n, 'Latitude')), lng = parseFloat(g(n, 'Longitude'));
    if (!isFinite(lat) || !isFinite(lng)) continue;
    const chi = n.getElementsByTagName('ChiPremisesAddress')[0];
    const eng = n.getElementsByTagName('EngPremisesAddress')[0];
    const src = chi || eng;
    const parts = [g(src, 'BuildingName'), g(src, 'EstateName'),
      (g(src, 'StreetName') + g(src, 'BuildingNoFrom')), g(src, 'DcDistrict')].filter(Boolean);
    out.push({ label: parts.join(' ') || '（未命名地點）', lat, lng });
  }
  return out;
}

  })();

  return dbPromise;
}

async function geocode(q) {
  const jobs = [srcALS, srcPhoton, srcNominatim, srcStops].map(f => limit(f(q), 12000));
  const rs = await Promise.allSettled(jobs);
  const all = [], fails = [];
  rs.forEach((r, i) => { if (r.status === 'fulfilled') all.push(...r.value); else fails.push(['政府地址', '地圖資料', '地圖資料', '巴士站'][i]); });
  const seen = new Set(), out = [];
  const qn = q.replace(/\s+/g, '');

  const sorted = all.filter(x => isFinite(x.lat) && isFinite(x.lng) && inHK(x.lat, x.lng)).map((x, i) => ({ x, i })).sort((a, b) => score(a.x) - score(b.x) || a.i - b.i);
  for (const { x } of sorted) {
    const k = x.label + '|' + x.lat.toFixed(4) + '|' + x.lng.toFixed(4);
    if (seen.has(k)) continue; seen.add(k); out.push(x);

    // 每種轉車次數都留一些候選，再限制要查詢的到站資料數量
    const quota = { 1: 30, 2: 20, 3: 12, 4: 8, 5: 6, 6: 6 };
    const cnt = {}, cands = [], keySet = new Set();
    for (const p of [...direct, ...trans].sort((a, b) => a.est - b.est)) {
      const n = p.legs.length;
      if ((cnt[n] || 0) >= quota[n]) continue;
      const ks = planKeys(p);
      const extra = ks.filter(k => !keySet.has(k)).length;
      if (keySet.size + extra > 150) continue;
      ks.forEach(k => keySet.add(k));
      cnt[n] = (cnt[n] || 0) + 1; cands.push(p);
    }
    const store = new Map(), keys = [...keySet];
    let done = 0;
    setStatus(`找到 ${cands.length} 個可能的方案，正在查 ${keys.length} 項實時到站資料…`);
    await pool(keys, 8, k => fetchEta(k, store), () => { done++; if (done % 5 === 0) setStatus(`查詢實時到站 ${done}／${keys.length}…`); });
    const now = Date.now();
    const ctx = { now, store, stops: nt.stops };
    const good = []; let dropped = 0;
    for (const p of cands) {
      const ev = evalPlan(p, ctx);
      if (ev.drop) dropped++; else good.push({ plan: p, ev });
    }
    good.sort((a, b) => a.ev.totalSec - b.ev.totalSec);
    current = good; shown = 0; selectedIdx = -1;
    searchState = { now, net: nt };
    renderResults(10);
    setStatus(good.length
      ? `完成（${hkTime(Date.now())}）。共 ${good.length} 個方案` + (dropped ? `；另有 ${dropped} 個因為沒有到站時間資料而不顯示` : '') + '。'
      : '暫時沒有可以顯示的方案（可能是這個時間沒有班次，或沒有到站時間資料）。' + (dropped ? `有 ${dropped} 個方案因為沒有到站時間資料而不顯示。` : ''));
  } catch (e) {
    setStatus('搜索失敗：' + e.message + '。請到「資料測試」分頁看看是哪一項不能用。');
  } finally { refreshGo(); }
}

function etaPill(min) {
  return `<span class="eta ${min < 6 ? 'y' : 'g'}">${min < 1 ? '即將' : min + ' 分鐘'}</span>`;
}
function renderResults(n) {
  const box = $('#results');
  shown = Math.min(current.length, n);
  box.innerHTML = current.slice(0, shown).map(({ ev }, idx) => {
    const first = ev.legs[0], nt = searchState.net;
    const mins = Math.max(1, Math.round(ev.totalSec / 60));
    const fl = [`步行 ${ev.walkO} 分`];
    ev.legs.forEach(l => { fl.push(`<span class="rt">${esc(l.r.route)}</span>`); if (l.walkAfter > 0) fl.push(`步行 ${l.walkAfter} 分`); });
    const flow = fl.join(' → ');
    const detail = ev.legs.map((l, k) => {
      const bs = nt.stops.get(l.r.stops[l.i]), as = nt.stops.get(l.r.stops[l.j]);
      const sched = l.board.rmk && l.board.rmk.indexOf('原定') >= 0 ? '（原定班次）' : '';
      return (k > 0 ? `<div class="sub">轉乘 ${esc(l.r.route)}：預計等候約 ${Math.max(0, Math.round(l.wait / 60000))} 分鐘</div>` : '') +
        `<div class="sub"><span class="rt">${esc(l.r.route)}</span> 往${esc(l.r.dest)}：「${esc(bs.name)}」上車（${l.nextMin < 1 ? '即將到' : l.nextMin + ' 分鐘後到'}${sched}），乘 ${l.nStops} 站，「${esc(as.name)}」下車${l.est ? '（行車時間為估算）' : ''}</div>`;
    }).join('');
    return `<div class="res" role="button" tabindex="0" data-idx="${idx}" aria-selected="${idx === selectedIdx}">
      <div class="top"><div class="tot">約 <b>${mins}</b> 分鐘<span class="tag">${ev.transfers ? '轉車 ' + ev.transfers + ' 次' : '直達'}</span>${ev.estimated ? '<span class="tag warn">含估算</span>' : ''}</div>
      <div class="nx">下一班 ${etaPill(first.nextMin)}</div></div>
      <div class="line">${flow}</div>${detail}</div>`;
  }).join('') + (current.length > shown ? `<button class="b" id="more" style="width:100%">顯示更多（還有 ${current.length - shown} 個）</button>` : '');
  const more = $('#more'); if (more) more.onclick = () => renderResults(shown + 10);
}
function selectResult(idx) {
  const item = current[idx]; if (!item) return;
  const { ev } = item, nt = searchState.net;
  selectedIdx = idx;
  document.querySelectorAll('.res').forEach(e => e.setAttribute('aria-selected', String(+e.dataset.idx === idx)));
  routeLayer.clearLayers();
  const allPts = [[pts.o.lat, pts.o.lng], [pts.d.lat, pts.d.lng]];
  const g = (a, b) => `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=walking`;
  const links = [];
  let prevPoint = pts.o, prevLabel = '起點';
  ev.legs.forEach((l, k) => {
    const col = LEG_COLORS[k % LEG_COLORS.length];
    const seg = l.r.stops.slice(l.i, l.j + 1).map(id => { const s = nt.stops.get(id); return [s.lat, s.lng]; });
    L.polyline(seg, { color: col, weight: 5, opacity: .85 }).addTo(routeLayer);
    allPts.push(...seg);
    const bs = nt.stops.get(l.r.stops[l.i]), as = nt.stops.get(l.r.stops[l.j]);
    L.marker([bs.lat, bs.lng], { icon: pinIcon('u', '上') }).bindTooltip(esc(l.r.route + '：' + bs.name)).addTo(routeLayer);
    L.marker([as.lat, as.lng], { icon: pinIcon('x', '下') }).bindTooltip(esc(l.r.route + '：' + as.name)).addTo(routeLayer);
    L.polyline([[prevPoint.lat, prevPoint.lng], [bs.lat, bs.lng]], { color: '#1b7a3a', weight: 3, dashArray: '6 6' }).addTo(routeLayer);
    if (k === 0 || (l.walkAfter !== undefined && ev.legs[k - 1].walkAfter > 0))
      links.push(`<a href="${g(prevPoint, bs)}" target="_blank" rel="noopener">步行導航：${k === 0 ? '走到上車站' : '轉乘走到 ' + esc(l.r.route) + ' 上車站'}（${esc(bs.name)}）</a>`);
    prevPoint = as; prevLabel = as.name;
  });
  L.polyline([[prevPoint.lat, prevPoint.lng], [pts.d.lat, pts.d.lng]], { color: '#b3261e', weight: 3, dashArray: '6 6' }).addTo(routeLayer);
  links.push(`<a href="${g(prevPoint, pts.d)}" target="_blank" rel="noopener">步行導航：下車後走到終點</a>`);
  map.fitBounds(L.latLngBounds(allPts), { padding: [30, 30] });
  $('#selInfo').innerHTML = `<div class="card"><b>步行導航</b>
    <div class="hint">地圖上的虛線是步行（直線示意，不是實際路徑），實線是巴士路線。實際步行路線請用下面的按鈕交給 Google 地圖。</div>
    <div class="links">${links.join('')}</div></div>`;
  $('#mapWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- 資料測試（只檢查巴士路線與到站資料） ---------- */
const diagLines = [];
const tests = [
  ['巴士路線資料（九巴／龍運／城巴）', async () => {
    const nt = await loadDb();
    const k = nt.routes.filter(r => r.co.includes('kmb')).length, c = nt.routes.filter(r => r.co.includes('ctb')).length;
    return `九巴／龍運 ${k} 條路線方向、城巴 ${c} 條路線方向、共 ${nt.stops.size} 個巴士站（${dbInfo.how}，版本 ${String(dbInfo.md5).slice(0, 8)}）`;
  }],
  ['九巴／龍運：實時到站', async () => {
    const nt = await loadDb();
    const rs = nt.routes.filter(r => r.co.includes('kmb') && String(r.st) === '1');
    for (let t = 0; t < 6; t++) {
      const r = rs[Math.floor((t + 1) * rs.length / 7)];
      const j = await getJSON(`${KMB}/route-eta/${encodeURIComponent(r.route)}/${encodeURIComponent(r.st)}`, 20000, 2);
      if (j.data.length) return `讀取成功，一次取得 ${j.data.length} 筆到站預報（路線 ${r.route}；資料時間 ${j.data[0].data_timestamp}）`;
    }
    return '讀取成功，但試過的路線現在都沒有班次預報（可能是收車時間）';
  }],
  ['城巴：實時到站', async () => {
    const nt = await loadDb();
    const rs = nt.routes.filter(r => r.co.includes('ctb'));
    for (let t = 0; t < 6; t++) {
      const r = rs[Math.floor((t + 1) * rs.length / 7)];
      const sid = r.stopsByCo.ctb[Math.floor(r.stopsByCo.ctb.length / 2)];
      const j = await getJSON(`${CTB}/eta/CTB/${encodeURIComponent(sid)}/${encodeURIComponent(r.route)}`, 15000, 2);
      const e = j.data.find(x => x.eta);
      if (e) return `讀取成功，取得 ${j.data.length} 筆到站預報（路線 ${r.route}；最近一班 ${e.eta}）`;
    }
    return '讀取成功，但試過的路線現在都沒有班次預報（可能是收車時間）';
  }]
];
async function runDiag() {
  const ul = $('#diagList'); ul.innerHTML = ''; diagLines.length = 0;
  $('#diagText').hidden = true;
  $('#runDiag').disabled = true;
  diagLines.push('樂悠巴 資料測試 ' + new Date().toLocaleString('zh-HK') + '；網址 ' + location.origin);
  for (const [name, fn] of tests) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="run">測試中…</span> ${esc(name)}`;
    ul.appendChild(li);
    const t0 = performance.now();
    let line;
    try {
      const msg = await fn();
      li.innerHTML = `<span class="ok">通過</span> ${esc(name)}<br><span class="hint">${esc(msg)}（${Math.round(performance.now() - t0)} 毫秒）</span>`;
      line = `[通過] ${name} — ${msg}`;
    } catch (e) {
      const m = e.name === 'AbortError' ? '等了太久沒有回應' : (e.message === 'Failed to fetch' ? '被瀏覽器擋住或連不上（Failed to fetch）' : e.message);
      li.innerHTML = `<span class="ng">失敗</span> ${esc(name)}<br><span class="hint">${esc(m)}</span>`;
      line = `[失敗] ${name} — ${m}`;
    }
    diagLines.push(line);
  }
  $('#runDiag').disabled = false;
}
async function copyDiag() {
  const text = diagLines.join('\n') || '還沒有測試結果，請先按「開始測試」。';
  const ta = $('#diagText'); ta.value = text; ta.hidden = false;
  try { await navigator.clipboard.writeText(text); $('#copyDiag').textContent = '已複製'; setTimeout(() => $('#copyDiag').textContent = '複製結果', 2000); }
  catch (e) { ta.focus(); ta.select(); }
}

/* ---------- 事件 ---------- */
function showTab(which) {
  const s = which === 's';
  $('#paneSearch').hidden = !s; $('#paneDiag').hidden = s;
  $('#tabSearch').setAttribute('aria-selected', String(s));
  $('#tabDiag').setAttribute('aria-selected', String(!s));
  if (s) setTimeout(() => map.invalidateSize(), 50);
}
$('#tabSearch').onclick = () => showTab('s');
$('#tabDiag').onclick = () => showTab('d');
$('#qO').addEventListener('input', () => onType('o'));
$('#qD').addEventListener('input', () => onType('d'));
$('#qO').addEventListener('focus', e => { if (e.target.value === '目前位置') setTimeout(() => e.target.select(), 0); });
$('#qO').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timers.o); doSearch('o'); } });
$('#qD').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timers.d); doSearch('d'); } });
$('#gpsO').onclick = () => useGpsAsOrigin(false);
$('#mapO').onclick = () => startPick('o');
$('#mapD').onclick = () => startPick('d');
$('#swap').onclick = () => {
  const keep = x => x && { lat: x.lat, lng: x.lng, label: x.label };
  const ka = keep(pts.o), kb = keep(pts.d);
  clearPoint('o'); clearPoint('d'); $('#qO').value = ''; $('#qD').value = '';
  if (kb) setPoint('o', kb.lat, kb.lng, kb.label);
  if (ka) setPoint('d', ka.lat, ka.lng, ka.label);
  refreshGo();
};
$('#go').onclick = runSearch;
$('#results').addEventListener('click', e => { const el = e.target.closest('.res'); if (el) selectResult(+el.dataset.idx); });
$('#results').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const el = e.target.closest('.res'); if (el) { e.preventDefault(); selectResult(+el.dataset.idx); } } });
$('#runDiag').onclick = runDiag;
$('#copyDiag').onclick = copyDiag;

/* ---------- 啟動：起點預設為目前位置，並在背景準備巴士資料 ---------- */
useGpsAsOrigin(true).then(ok => { if (!ok && !pts.o) refreshGo(); });
loadDb().catch(() => { /* 搜索時會再顯示錯誤 */ });
</script>
