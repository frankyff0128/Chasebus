<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樂悠巴</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --fg:#16212b; --muted:#5d6b76; --line:#d9ded8;
  --accent:#0d7a69; --accent-fg:#ffffff; --warn:#a85f00; --bad:#b3261e; --good:#1b7a3a;
  --soft:#e6efec; --stop:#2a5db0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10171d; --card:#18222b; --fg:#e8edf0; --muted:#9aa8b2; --line:#2b3944;
    --accent:#3fc2aa; --accent-fg:#06211c; --warn:#f0b254; --bad:#ff8a80; --good:#7fd69a;
    --soft:#1f3a36; --stop:#7aa7ee; color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","Noto Sans CJK TC","PingFang HK","Microsoft JhengHei",sans-serif;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:max(24px,env(safe-area-inset-bottom,0px));}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 8px}
header h1{margin:0;font-size:24px;letter-spacing:.04em}
header .ver{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font:inherit;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row input[type=text]{flex:1 1 180px;min-width:0}
.inp{position:relative;flex:1 1 180px;min-width:0;display:flex}
.inp input[type=text]{width:100%;padding-right:38px}
.inp .x{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:17px;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.inp .x:active{background:var(--soft)}
input[type=text],select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button.b{padding:9px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;font:inherit}
button.b:active{background:var(--soft)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;padding:12px;width:100%;font-size:16px}
button:disabled{opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sugg{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sugg li button{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.sugg li:last-child button{border-bottom:0}
.sugg .src{font-size:11px;color:var(--muted);margin-left:6px}
.hint{font-size:13px;color:var(--muted)}
.banner{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px}
details{margin:2px 0 10px}
summary{cursor:pointer;color:var(--muted);font-weight:600;padding:4px 0}
details .field{margin-top:8px}
#mapWrap{position:relative;margin-bottom:10px}
#map{height:46vh;min-height:300px;border-radius:10px;border:1px solid var(--line);z-index:0}
#mapWrap.full{position:fixed;inset:0;z-index:2000;margin:0;background:var(--bg)}
#mapWrap.full #map{height:100%;min-height:0;border-radius:0;border:0}
.pickbar{position:absolute;left:0;right:0;z-index:1500;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pickbar.top{top:0;padding-top:max(10px,env(safe-area-inset-top,0px))}
.pickbar.bottom{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.pickbar span{flex:1;min-width:0;overflow-wrap:anywhere}
.pickbar button{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-weight:700}
.pickbar button.ok{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pin{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.o{background:#1b7a3a}.pin.d{background:#b3261e}.pin.u{background:#2a5db0}.pin.x{background:#6b4aa8}.pin.t{background:#444}
.res{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card);cursor:pointer}
.res[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.res .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.res .tot{font-size:17px}.res .tot b{font-size:24px;font-variant-numeric:tabular-nums}
.res .nx{font-size:14px;color:var(--muted);white-space:nowrap}
.dbg{font-size:12px;color:var(--muted);margin-top:8px}.dbg div{margin-top:3px}
.res .fare{font-size:17px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.eta{display:inline-block;padding:2px 10px;border-radius:8px;font-size:20px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums;vertical-align:middle}
.eta.y{background:#f7c600;color:#2b2200}
.eta.g{background:#1f9d55;color:#fff}
.tag.good{background:#1f9d55;color:#fff}
.res{scroll-margin-top:8px}
#results,#status{scroll-margin-top:10px}
.grp{font-weight:700;margin:14px 2px 6px;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--soft);margin-left:4px;vertical-align:middle}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.res .line{margin:6px 0}.res .sub{font-size:13px;color:var(--muted);margin-top:2px}
.rt{display:inline-block;padding:0 7px;border-radius:5px;background:#d32f2f;color:#fff;font-weight:700}
.rt.c{background:#4aa3ff;color:#000}
.wt{font-weight:800}.wt.y{color:#d9a400}.wt.g{color:#1f9d55}
.nx2{color:var(--muted);font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a{display:inline-block;padding:8px 10px;border:1px solid var(--accent);color:var(--accent);border-radius:8px;text-decoration:none;font-weight:600}
.diag li{padding:8px 0;border-bottom:1px solid var(--line);list-style:none;overflow-wrap:anywhere}
.diag{padding:0;margin:0}
.ok{color:var(--good);font-weight:700}.ng{color:var(--bad);font-weight:700}.run{color:var(--muted)}
textarea{width:100%;min-height:140px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:12px/1.4 ui-monospace,monospace}
.leaflet-container{font:inherit}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>樂悠巴</h1><span class="ver">測試版 v9.4</span></header>
<div id="envWarn" class="banner" hidden></div>
<div class="tabs" role="tablist">
  <button id="tabSearch" role="tab" aria-selected="true">查路線</button>
  <button id="tabDiag" role="tab" aria-selected="false">資料測試</button>
</div>

<section id="paneSearch">
  <div class="card">
    <div class="field">
      <label for="qO">起點</label>
      <div class="row"><div class="inp"><input id="qO" type="text" value="目前位置" autocomplete="off" enterkeyhint="search"><button type="button" class="x" id="xO" aria-label="清除起點內容">×</button></div><button class="b" id="mapO">在地圖點選</button></div>
      <ul class="sugg" id="suO" hidden></ul>
    </div>
    <div class="field">
      <label for="qD">終點</label>
      <div class="row"><div class="inp"><input id="qD" type="text" placeholder="想去邊？" autocomplete="off" enterkeyhint="search"><button type="button" class="x" id="xD" aria-label="清除終點內容" hidden>×</button></div><button class="b" id="mapD">在地圖點選</button></div>
      <ul class="sugg" id="suD" hidden></ul>
    </div>
    <div class="row" style="margin-bottom:8px"><button class="b" id="gpsO">起點用目前位置</button><button class="b" id="swap">起終點互換</button></div>
    <details>
      <summary>更多設定</summary>
      <div class="field"><label for="maxTr">最多轉車次數</label>
        <select id="maxTr"><option value="0">不轉車（只看直達）</option><option value="1">1 次</option><option value="2">2 次</option><option value="3" selected>3 次</option><option value="4">4 次</option><option value="5">5 次</option></select></div>
      <div class="field"><label for="trWalk">轉車時最多步行</label>
        <select id="trWalk"><option value="3">3 分鐘</option><option value="5" selected>5 分鐘</option><option value="8">8 分鐘</option><option value="10">10 分鐘</option></select></div>
      <div class="field"><label><input type="checkbox" id="strict"> 只顯示行車時間全程都有實時預報的方案（結果會少很多）</label>
        <span class="hint">官方到站預報只列出每個站接下來的幾班車，長途行程的後段常常沒有預報，那部分會按前段的實際車速推算，並標示「含估算」。</span></div>
      <div class="field"><label for="rad">起點、終點旁邊找巴士站的範圍</label>
        <select id="rad"><option value="500">500 米</option><option value="800">800 米</option><option value="1000" selected>1 公里</option><option value="1500">1.5 公里</option></select></div>
    </details>
    <button class="primary" id="go" disabled>搜索巴士</button>
    <p class="hint" id="status" role="status">先設定終點。</p>
    <p class="hint" id="dbStat"></p>
  </div>
  <div id="mapWrap">
    <div id="map" aria-label="地圖"></div>
    <div class="pickbar top" id="pickTop" hidden><span id="pickMsg"></span><button type="button" id="pickCancel">取消</button></div>
    <div class="pickbar bottom" id="pickBottom" hidden><span id="pickLabel">請點一下地圖</span><button type="button" class="ok" id="pickOk" disabled>確定</button></div>
  </div>
  <div id="selInfo"></div>
  <div id="results"></div>
</section>

<section id="paneDiag" hidden>
  <div class="card">
    <p style="margin-top:0">這一頁檢查程式能不能讀到巴士路線和到站資料。按一下開始測試，完成後按「複製結果」，貼給我就可以。</p>
    <div class="row"><button class="b primary" id="runDiag" style="width:auto">開始測試</button><button class="b" id="copyDiag">複製結果</button></div>
    <ul class="diag" id="diagList"></ul>
    <textarea id="diagText" hidden readonly aria-label="測試結果文字"></textarea>
  </div>
</section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* ============ 純計算部分（不碰畫面，方便單獨測試）BEGIN_LOGIC ============ */
const KMB = 'https://data.etabus.gov.hk/v1/transport/kmb';
const CTB = 'https://rt.data.gov.hk/v2/transport/citybus';
const WALK_M_PER_MIN = 75, DETOUR = 1.25, RIDE_SEC_PER_STOP = 90;
const WAIT_EST = 240;          // 粗略篩選時，每次上車假設等 4 分鐘（只用來排先後，最後結果全部用實時資料）
const TRANSFER_BUF_MS = 3 * 60000; // 轉乘空隙：下車步行到轉乘站後，最少要多 3 分鐘才有下一班車
const CTB_GAP = 3;             // 城巴：追蹤同一班車時，每隔幾個站查一次到站時間
const DWELL_SEC = 20, BUS_MPS = 6; // 粗略篩選時的行車速度（約每小時 21.6 公里，含停站）

function hav(lat1, lon1, lat2, lon2) {
  const R = 6371000, p = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * p / 2) ** 2 +
    Math.cos(lat1 * p) * Math.cos(lat2 * p) * Math.sin((lon2 - lon1) * p / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function walkMin(m) { return Math.max(1, Math.ceil(m * DETOUR / WALK_M_PER_MIN)); }
/* 轉車步行：幾乎同一個位置就當作 0 分鐘 */
function walkTr(m) { return m < 25 ? 0 : walkMin(m); }
/* ---------- 真實步行距離：地政總署 Map API 行人路線。查到就用，查不到就退回直線估算 ---------- */
const PED = 'https://mapapi.hkmapservice.gov.hk/PedRoute/NAServer/route/';
const pedCache = new Map(); let pedMode = null, pedFails = 0, pedOk = 0;
const pedKey = (a, b) => a.lat.toFixed(5) + ',' + a.lng.toFixed(5) + '|' + b.lat.toFixed(5) + ',' + b.lng.toFixed(5);
function realMin(a, b, fbM, transfer) {
  const m = pedCache.get(pedKey(a, b));
  if (m === undefined) return transfer ? walkTr(fbM) : walkMin(fbM);
  return (transfer && m < 25) ? 0 : Math.max(1, Math.ceil(m / WALK_M_PER_MIN));
}
async function pedRoute(a, b) {
  const key = pedKey(a, b);
  if (pedCache.has(key) || (pedFails >= 6 && !pedOk)) return;
  try {
    if (pedMode === null) {
      const m = await getJSON(PED + 'retrieveTravelModes?f=json', 15000, 1);
      const x = (m.supportedTravelModes || [])[0]; // 第一項是「最短路徑」
      pedMode = x ? (x.id ?? x.itemId ?? x.name) : 1;
      if (typeof pedMode === 'object') pedMode = JSON.stringify(pedMode);
    }
    const stops = { features: [a, b].map((q, i) => ({ attributes: { Name: 'P' + i }, geometry: { spatialReference: { latestWkid: 4326 }, x: q.lng, y: q.lat } })) };
    const r = await getJSON(PED + 'solve?stops=' + encodeURIComponent(JSON.stringify(stops)) + '&travelMode=' + encodeURIComponent(pedMode) + '&directionsLanguage=zh-HK&outSR=4326&f=json&returnZ=true&returnDirections=false&returnRoutes=true', 15000, 1);
    const f = r.routes && r.routes.features && r.routes.features[0];
    let len = 0;
    if (f) for (const path of (f.geometry.paths || [])) for (let i = 1; i < path.length; i++) len += hav(path[i - 1][1], path[i - 1][0], path[i][1], path[i][0]);
    if (len > 0) { pedCache.set(key, len); pedOk++; } else pedFails++;
  } catch (e) { pedFails++; }
}
async function prefetchWalk(pairs, label) {
  const seen = new Set(), todo = [];
  for (const [a, b] of pairs) {
    if (!a || !b) continue;
    const k = pedKey(a, b);
    if (seen.has(k) || pedCache.has(k) || hav(a.lat, a.lng, b.lat, b.lng) < 25) continue;
    seen.add(k); todo.push([a, b]);
  }
  if (!todo.length) return;
  let done = 0;
  setStatus(label + '（0／' + todo.length + '）');
  await Promise.race([
    pool(todo, 6, ([a, b]) => pedRoute(a, b), () => { done++; if (done % 10 === 0) setStatus(label + '（' + done + '／' + todo.length + '）'); }),
    new Promise(r => setTimeout(r, 8000))
  ]);
}

function nearStops(stops, lat, lng, r) {
  const out = new Map();
  for (const [id, s] of stops) {
    const d = hav(lat, lng, s.lat, s.lng);
    if (d <= r) out.set(id, d);
  }
  return out;
}

/* ---- 官方資料（data.gov.hk 公布的九巴／龍運、城巴介面）整理成統一格式 ----
   routes: [{id,route,co:[co],stops:{co:[站 id，依站序]},bound:{co:'O'|'I'},orig,dest,st}]
   stops:  {站 id: [名稱, 緯度, 經度]} */
function kmbDb(rj, sj, rsj) {
  const stops = {};
  for (const s of sj.data) {
    const lat = parseFloat(s.lat), lng = parseFloat(s.long);
    if (isFinite(lat) && isFinite(lng)) stops[s.stop] = [s.name_tc || s.name_en || s.stop, lat, lng];
  }
  const rmap = new Map();
  for (const r of rj.data) {
    if (String(r.service_type) !== '1') continue; // 只用主要班次，特別班次略過
    rmap.set(r.route + '|' + r.bound, { id: 'kmb|' + r.route + '|' + r.bound, route: r.route, bound: r.bound, orig: r.orig_tc, dest: r.dest_tc, arr: [] });
  }
  for (const x of rsj.data) {
    if (String(x.service_type) !== '1') continue;
    const r = rmap.get(x.route + '|' + x.bound);
    const q = parseInt(x.seq, 10);
    if (r && q >= 1 && q <= 1000) r.arr[q - 1] = x.stop;
  }
  const routes = [];
  for (const r of rmap.values()) {
    const a = Array.from(r.arr, x => x || ''); // 站序有缺口時用空字串佔位，保持站序位置正確
    if (a.length < 2) continue;
    routes.push({ id: r.id, route: r.route, co: ['kmb'], stops: { kmb: a }, bound: { kmb: r.bound }, orig: r.orig, dest: r.dest, st: '1' });
  }
  return { routes, stops };
}
function ctbDb(list, rs, stopInfo) {
  const stops = {}, routes = [];
  for (const [id, s] of stopInfo) stops[id] = [s.name, s.lat, s.lng];
  for (const r of list) for (const dir of ['O', 'I']) {
    const a = rs.get(r.route + '|' + dir);
    if (!a || a.length < 2) continue;
    routes.push({
      id: 'ctb|' + r.route + '|' + dir, route: r.route, co: ['ctb'], stops: { ctb: a }, bound: { ctb: dir },
      orig: dir === 'O' ? r.orig_tc : r.dest_tc, dest: dir === 'O' ? r.dest_tc : r.orig_tc, st: '1'
    });
  }
  return { routes, stops };
}
function mergeDb(a, b) {
  return { routes: a.routes.concat(b.routes), stops: Object.assign({}, a.stops, b.stops) };
}

/* 建立路線網絡。route.stops = 有座標的車站 id；route.pos = 它在官方站序中的位置（0 起算） */
function buildNet(db) {
  const stops = new Map(), slist = [], sidx = new Map();
  for (const id in db.stops) {
    const [name, lat, lng] = db.stops[id];
    stops.set(id, { name, lat, lng });
    sidx.set(id, slist.length); slist.push(id);
  }
  const routes = [];
  for (const r of db.routes) {
    let cos = r.co.filter(c => r.stops[c] && r.stops[c].length > 1);
    if (!cos.length) continue;
    const main = cos[0], len = r.stops[main].length;
    cos = cos.filter(c => r.stops[c].length === len); // 聯營路線兩邊站數要一致才能對位
    const ids = [], pos = [];
    r.stops[main].forEach((id, k) => { if (stops.has(id)) { ids.push(id); pos.push(k); } });
    if (ids.length < 2) continue;
    const cum = [0];
    for (let k = 1; k < ids.length; k++) {
      const a = stops.get(ids[k - 1]), b = stops.get(ids[k]);
      cum.push(cum[k - 1] + DWELL_SEC + hav(a.lat, a.lng, b.lat, b.lng) * DETOUR / BUS_MPS);
    }
    routes.push({
      id: r.id, route: r.route, co: cos, main, stopsByCo: r.stops, bound: r.bound, st: r.st,
      orig: r.orig, dest: r.dest, stops: ids, pos, cum, sIdx: ids.map(x => sidx.get(x))
    });
  }
  const routesAt = slist.map(() => []);
  routes.forEach((r, ri) => r.sIdx.forEach((sx, k) => routesAt[sx].push([ri, k])));
  return { stops, slist, sidx, routes, routesAt, nbCache: new Map() };
}

/* 每個車站附近（步行範圍內）的其他車站，用格子加快搜尋 */
function neighborsOf(net, maxM) {
  if (net.nbCache.has(maxM)) return net.nbCache.get(maxM);
  const dLat = maxM / 111000, dLng = maxM / 102700;
  const grid = new Map();
  const key = (a, b) => a + ',' + b;
  net.slist.forEach((id, i) => {
    const s = net.stops.get(id);
    const k = key(Math.floor(s.lat / dLat), Math.floor(s.lng / dLng));
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  });
  const nb = net.slist.map(() => []);
  net.slist.forEach((id, i) => {
    const s = net.stops.get(id);

        const dD = dNear.get(ids[j]);

        if (!best || est < best.est) best = { i, j, dO, dD, est };

function idb() {

const DB_MAX_AGE = 3 * 24 * 3600 * 1000; // 路線資料每日更新，暫存用 3 日

async function fetchKmbDb() {

async function fetchCtbDb() {
  const rl = (await getJSON(CTB + '/route/ctb', 40000)).data;
  const jobs = [];
  rl.forEach(r => ['O', 'I'].forEach(d => jobs.push([r.route, d])));
  const rs = new Map(); let done = 0, failed = 0;
  await pool(jobs, 8, async ([route, d]) => {
    try {
      const j = await getJSON(`${CTB}/route-stop/CTB/${encodeURIComponent(route)}/${d === 'O' ? 'outbound' : 'inbound'}`, 20000, 2);
      rs.set(route + '|' + d, j.data.slice().sort((a, b) => a.seq - b.seq).map(x => x.stop));
    } catch (e) { failed++; }
  }, () => { done++; if (done % 20 === 0) setProg(`正在下載城巴路線資料 ${done}／${jobs.length}…`); });
  const ids = new Set();
  rs.forEach(a => a.forEach(x => ids.add(x)));
  const idList = [...ids], info = new Map(); let sd = 0, sFail = 0;
  await pool(idList, 10, async id => {
    try {
      const j = await getJSON(`${CTB}/stop/${encodeURIComponent(id)}`, 15000, 2);
      const lat = parseFloat(j.data.lat), lng = parseFloat(j.data.long);
      if (isFinite(lat) && isFinite(lng)) info.set(id, { name: j.data.name_tc || j.data.name_en || id, lat, lng });
    } catch (e) { sFail++; }
  }, () => { sd++; if (sd % 50 === 0) setProg(`正在下載城巴車站資料 ${sd}／${idList.length}…`); });
  const bad = failed + sFail;
  return { db: ctbDb(rl, rs, info), ok: rl.length > 0 && bad <= (jobs.length + idList.length) * 0.1, bad };
}
function loadDb() {
  if (dbPromise) return dbPromise;
  dbPromise = (async () => {
    let cached = null;
    try { cached = await idbGet('db2'); } catch (e) { /* 沒有暫存也沒關係 */ }
    if (cached && cached.db && Date.now() - cached.t < DB_MAX_AGE) {
      net = buildNet(cached.db);
      dbInfo = { how: '使用手機暫存（' + new Date(cached.t).toLocaleDateString('zh-HK') + ' 下載）', ctbErr: '' };
      setProg('');
      return net;
    }
    try {
      const k = await fetchKmbDb();
      let c = { db: { routes: [], stops: {} }, ok: false, bad: 0 }, ctbErr = '';
      try { c = await fetchCtbDb(); } catch (e) { ctbErr = e.message; }
      if (!c.ok && !ctbErr) ctbErr = '城巴資料有 ' + c.bad + ' 項沒讀到';
      const db = mergeDb(k, c.db);
      net = buildNet(db);
      dbInfo = { how: '剛從官方介面下載', ctbErr };
      if (c.ok) { try { await idbSet('db2', { t: Date.now(), db }); } catch (e) { /* 存不了也沒關係 */ } }
      setProg('');
      return net;
    } catch (e) {
      if (cached && cached.db) { // 下載失敗時，寧願用舊資料
        net = buildNet(cached.db);
        dbInfo = { how: '下載新資料失敗，暫用舊暫存', ctbErr: '' };
        setProg('');
        return net;
      }
      throw e;
    }
  })();
  dbPromise.catch(() => { dbPromise = null; setProg(''); });
  return dbPromise;
}

function limit(p, ms) { return withTimeout(p, ms); }
async function srcALS(q) {
  const xml = await getText('https://www.als.gov.hk/lookup?q=' + encodeURIComponent(q) + '&n=8', 9000);
  return parseALS(xml, DOMParser).map(x => ({ ...x, src: '政府地址' }));

async function srcStops(q) {
  if (!net) return [];
  const key = q.replace(/\s+/g, '');
  const seen = new Map();
  for (const [id, s] of net.stops) {
    if (!s.name || !s.name.replace(/\s+/g, '').includes(key)) continue;
    if (!seen.has(s.name)) seen.set(s.name, { label: '巴士站：' + s.name, lat: s.lat, lng: s.lng, src: '巴士站', len: s.name.length });
  }
  return [...seen.values()].sort((a, b) => a.len - b.len).slice(0, 5);
}
async function geocode(q) {
  const jobs = [srcALS, srcStops].map(f => limit(f(q), 12000));
  const rs = await Promise.allSettled(jobs);
  const all = [], fails = [];
  rs.forEach((r, i) => { if (r.status === 'fulfilled') all.push(...r.value); else fails.push(['政府地址', '巴士站'][i]); });
  const seen = new Set(), out = [];
  const qn = q.replace(/\s+/g, '');
  const score = x => (x.label.replace(/\s+/g, '').includes(qn) ? 0 : 1);
  const sorted = all.filter(x => isFinite(x.lat) && isFinite(x.lng) && inHK(x.lat, x.lng)).map((x, i) => ({ x, i })).sort((a, b) => score(a.x) - score(b.x) || a.i - b.i);
  for (const { x } of sorted) {
    const k = x.label + '|' + x.lat.toFixed(4) + '|' + x.lng.toFixed(4);
    if (seen.has(k)) continue; seen.add(k); out.push(x);
  }
  return { list: out.slice(0, 12), fails };
}

    li.innerHTML = `<span class="run">測試中…</span> ${esc(name)}`;
    ul.appendChild(li);
    const t0 = performance.now();
    let line;
    try {
      const msg = await fn();
      li.innerHTML = `<span class="ok">通過</span> ${esc(name)}<br><span class="hint">${esc(msg)}（${Math.round(performance.now() - t0)} 毫秒）</span>`;
      line = `[通過] ${name} — ${msg}`;
    } catch (e) {
      const m = e.name === 'AbortError' ? '等了太久沒有回應' : (e.message === 'Failed to fetch' ? '被瀏覽器擋住或連不上（Failed to fetch）' : e.message);
      li.innerHTML = `<span class="ng">失敗</span> ${esc(name)}<br><span class="hint">${esc(m)}</span>`;
      line = `[失敗] ${name} — ${m}`;
    }
    diagLines.push(line);
  }
  $('#runDiag').disabled = false;
}
async function copyDiag() {
  const text = diagLines.join('\n') || '還沒有測試結果，請先按「開始測試」。';
  const ta = $('#diagText'); ta.value = text; ta.hidden = false;
  try { await navigator.clipboard.writeText(text); $('#copyDiag').textContent = '已複製'; setTimeout(() => $('#copyDiag').textContent = '複製結果', 2000); }
  catch (e) { ta.focus(); ta.select(); }
}

/* ---------- 事件 ---------- */
function showTab(which) {
  const s = which === 's';
  $('#paneSearch').hidden = !s; $('#paneDiag').hidden = s;
  $('#tabSearch').setAttribute('aria-selected', String(s));
  $('#tabDiag').setAttribute('aria-selected', String(!s));
  if (s) setTimeout(() => map.invalidateSize(), 50);
}
$('#tabSearch').onclick = () => showTab('s');
$('#tabDiag').onclick = () => showTab('d');
function clearField(which) {
  const el = which === 'o' ? $('#qO') : $('#qD');
  clearTimeout(timers[which]); searchSeq[which]++;
  clearPoint(which);
  el.value = '';
  (which === 'o' ? $('#suO') : $('#suD')).hidden = true;
  syncX(which); refreshGo();
  setStatus(which === 'o' ? '請輸入起點，或按「起點用目前位置」。' : '請輸入終點。');
  el.focus();
}
$('#xO').onclick = () => clearField('o');
$('#xD').onclick = () => clearField('d');
$('#qO').addEventListener('input', () => onType('o'));
$('#qD').addEventListener('input', () => onType('d'));
$('#qO').addEventListener('focus', e => { if (e.target.value === '目前位置') setTimeout(() => e.target.select(), 0); });
$('#qO').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timers.o); doSearch('o'); } });
$('#qD').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timers.d); doSearch('d'); } });
$('#gpsO').onclick = () => useGpsAsOrigin(false);
$('#mapO').onclick = () => startPick('o');
$('#mapD').onclick = () => startPick('d');
$('#swap').onclick = () => {
  const keep = x => x && { lat: x.lat, lng: x.lng, label: x.label };
  const ka = keep(pts.o), kb = keep(pts.d);
  clearPoint('o'); clearPoint('d'); $('#qO').value = ''; $('#qD').value = ''; syncX('o'); syncX('d');
  if (kb) setPoint('o', kb.lat, kb.lng, kb.label);
  if (ka) setPoint('d', ka.lat, ka.lng, ka.label);
  refreshGo();
};
$('#go').onclick = runSearch;
$('#results').addEventListener('click', e => { const el = e.target.closest('.res'); if (el) selectResult(+el.dataset.idx); });
$('#results').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const el = e.target.closest('.res'); if (el) { e.preventDefault(); selectResult(+el.dataset.idx); } } });
$('#runDiag').onclick = runDiag;
$('#copyDiag').onclick = copyDiag;

/* ---------- 啟動：起點預設為目前位置，並在背景準備巴士資料 ---------- */
syncX('o');
useGpsAsOrigin(true).then(ok => { if (!ok && !pts.o) refreshGo(); });
loadDb().catch(() => { /* 搜索時會再顯示錯誤 */ });
setTimeout(() => { loadFares().then(() => { try { if (current && current.length && searchState) renderResults(); } catch (e) {} }).catch(() => {}); }, 3000);
</script>
</body>
</html>
